<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e7f8fa">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="account-bar" aria-live="polite">
      <span class="account-name" id="account-name"></span>
      <span class="account-stats" id="account-stats"></span>
      <button id="ranking-open" type="button">Ranking</button>
      <button id="account-open" type="button">Entrar / Criar conta</button>
      <button id="account-logout" type="button" hidden>Sair</button>
    </header>

    <main class="game-stage">
      <div class="game-container">
        <canvas id="game-canvas" width="320" height="480" aria-label="Jogo Flappy Bird"></canvas>
        <button class="pause-toggle" id="pause-toggle" type="button" hidden>Pausar</button>
      </div>
    </main>

    <canvas class="pipe-extension" id="pipe-extension" aria-hidden="true"></canvas>

    <div
      class="pause-overlay"
      id="pause-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Jogo pausado"
      hidden
    >
      <button id="resume-game" type="button">Retornar</button>
    </div>

    <div class="ranking-dialog" id="ranking-dialog" hidden>
      <section class="ranking-card" role="dialog" aria-modal="true" aria-labelledby="ranking-title">
        <div class="ranking-heading">
          <h1 id="ranking-title">Ranking</h1>
          <button
            class="ranking-close"
            id="ranking-close"
            type="button"
            aria-label="Fechar ranking"
          >×</button>
        </div>
        <p class="ranking-message" id="ranking-message" role="status" aria-live="polite">
          Carregando ranking...
        </p>
        <div class="ranking-table-wrap">
          <table class="ranking-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Jogador</th>
                <th scope="col">Pontuação</th>
              </tr>
            </thead>
            <tbody id="ranking-list"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="account-dialog" id="account-dialog" hidden>
      <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button
          class="dialog-close"
          id="account-close"
          type="button"
          aria-label="Fechar"
        >×</button>
        <h1 id="auth-title">Sua conta</h1>
        <div class="auth-switch">
          <button id="show-login" type="button" aria-pressed="true">Entrar</button>
          <button id="show-register" type="button" aria-pressed="false">Criar conta</button>
        </div>
        <form class="auth-form" id="auth-form">
          <label>
            Nome
            <input
              id="auth-name"
              name="name"
              autocomplete="username"
              maxlength="60"
              minlength="2"
              required
              placeholder="Seu nome"
            >
          </label>
          <label>
            Senha
            <input
              id="auth-password"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="8"
              required
              placeholder="Mínimo de 8 caracteres"
            >
          </label>
          <button id="auth-submit" type="submit">Entrar</button>
          <p class="auth-message" id="auth-message" role="status"></p>
        </form>
      </section>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
