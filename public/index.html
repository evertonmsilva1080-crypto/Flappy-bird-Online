<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7f8fa">
<title>Flappy Bird</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: #e7f8fa; color: #164c55; font-family: Arial, sans-serif; }
.account-bar { flex: 0 0 auto; min-height: 52px; display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); }
.account-name { max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.account-stats { font-size: 12px; white-space: nowrap; }
button { min-height: 44px; border: 0; border-radius: 8px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.account-bar button, .auth-form button { background: #188e9e; color: #fff; }
button:disabled { opacity: .65; cursor: wait; }
.game-stage { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding: 4px 12px max(8px, env(safe-area-inset-bottom)); }
#game-canvas { display: block; width: min(320px, calc(100vw - 24px), 54vh); height: auto; max-height: 100%; aspect-ratio: 2 / 3; border: 1px solid #000; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.account-dialog { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); background: rgb(10 30 35 / 62%); }
.account-dialog[hidden], .auth-form [hidden] { display: none; }
.auth-card { width: min(100%, 390px); max-height: 100%; overflow-y: auto; padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 16px 50px rgb(0 0 0 / 25%); }
.auth-card h1 { margin: 0 40px 18px 0; color: #164c55; font-size: 24px; }
.dialog-close { float: right; padding: 6px 12px; background: #edf5f6; color: #164c55; font-size: 20px; }
.auth-switch { display: flex; gap: 8px; margin-bottom: 18px; }
.auth-switch button { flex: 1; background: #edf5f6; color: #164c55; }
.auth-switch button[aria-pressed="true"] { background: #c8edf0; }
.auth-form label { display: block; margin: 12px 0; color: #263b3e; font-size: 14px; font-weight: 700; }
.auth-form input { display: block; width: 100%; min-height: 44px; margin-top: 6px; padding: 11px; border: 1px solid #b8cacc; border-radius: 8px; font: inherit; }
.auth-form button { width: 100%; margin-top: 8px; }
.auth-message { min-height: 20px; margin: 12px 0 0; color: #a32222; font-size: 14px; overflow-wrap: anywhere; }
@media (max-width: 520px) {
  .account-bar { justify-content: center; gap: 6px 8px; min-height: 54px; }
  .account-name { max-width: 40vw; font-size: 14px; }
  .account-stats { font-size: 11px; }
  .account-bar button { min-height: 42px; padding: 9px 12px; font-size: 14px; }
  .auth-card { padding: 20px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .account-bar { min-height: 44px; padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: 4px; }
  #game-canvas { width: min(240px, 50vh); }
}
</style>
</head>
<body>
<header class="account-bar" aria-live="polite">
  <span class="account-name" id="account-name"></span>
  <span class="account-stats" id="account-stats"></span>
  <button id="account-open" type="button">Entrar / Criar conta</button>
  <button id="account-logout" type="button" hidden>Sair</button>
</header>
<main class="game-stage">
  <canvas id="game-canvas" width="320" height="480" aria-label="Jogo Flappy Bird"></canvas>
</main>
<div class="account-dialog" id="account-dialog" hidden>
  <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <button class="dialog-close" id="account-close" type="button" aria-label="Fechar">×</button>
    <h1 id="auth-title">Sua conta</h1>
    <div class="auth-switch">
      <button id="show-login" type="button" aria-pressed="true">Entrar</button>
      <button id="show-register" type="button" aria-pressed="false">Criar conta</button>
    </div>
    <form class="auth-form" id="auth-form">
      <label id="name-field" hidden>Nome
        <input id="auth-name" name="name" autocomplete="name" maxlength="60" placeholder="Seu nome">
      </label>
      <label>E-mail
        <input id="auth-email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="voce@exemplo.com">
      </label>
      <label>Senha
        <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo de 8 caracteres">
      </label>
      <button id="auth-submit" type="submit">Entrar</button>
      <p class="auth-message" id="auth-message" role="status"></p>
    </form>
  </section>
</div>
<script type="module" src="./script.js"></script>
</body>
</html>
