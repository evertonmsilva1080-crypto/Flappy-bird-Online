<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e7f8fa">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="account-bar" aria-live="polite">
      <span class="account-name" id="account-name"></span>
      <span class="account-stats" id="account-stats"></span>
    </header>

    <main class="game-stage">
      <div class="game-container">
        <canvas id="game-canvas" width="320" height="480" aria-label="Jogo Flappy Bird"></canvas>
      </div>
    </main>

    <button
      class="pause-toggle"
      id="pause-toggle"
      type="button"
      aria-label="Pausar jogo"
      title="Pausar jogo"
      hidden
    >
      <span class="pause-icon" aria-hidden="true"><i></i><i></i></span>
    </button>
    <div class="game-hud" id="game-hud" aria-label="Estatísticas da partida" hidden>
      <span class="game-hud-stat"><span>Moedas</span><strong id="game-coins">0000</strong></span>
      <span class="game-hud-divider" aria-hidden="true"></span>
      <span class="game-hud-stat"><span>Pontos</span><strong id="game-score">0000</strong></span>
    </div>
    <button
      class="profile-toggle"
      id="account-open"
      type="button"
      aria-label="Abrir perfil"
      title="Perfil"
    >
      <svg class="profile-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M5 29v-5a11 11 0 0 1 22 0v5z" fill="#edb34e" stroke="#32170f" stroke-width="2"/>
        <path d="M9 25h14" stroke="#fff0b0" stroke-width="2"/>
      </svg>
    </button>

    <canvas class="pipe-extension" id="pipe-extension" aria-hidden="true"></canvas>

    <div
      class="pause-overlay"
      id="pause-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Jogo pausado. Toque em qualquer lugar para continuar."
      tabindex="0"
      hidden
    >
      <div class="pause-prompt" aria-live="assertive">
        <span id="pause-message">Jogo pausado</span>
        <strong id="pause-countdown" hidden></strong>
      </div>
    </div>

    <div class="ranking-dialog" id="ranking-dialog" hidden>
      <section class="ranking-card" role="dialog" aria-modal="true" aria-labelledby="ranking-title">
        <h1 class="visually-hidden" id="ranking-title">Ranking</h1>
        <button
          class="ranking-close"
          id="ranking-close"
          type="button"
          aria-label="Fechar ranking"
        >×</button>
        <div class="ranking-board">
          <div class="ranking-table-wrap">
            <table class="ranking-table">
              <thead class="visually-hidden">
                <tr>
                  <th scope="col">Nome</th>
                  <th scope="col">Pontuação</th>
                </tr>
              </thead>
              <tbody id="ranking-list"></tbody>
            </table>
          </div>
        </div>
        <p class="ranking-message" id="ranking-message" role="status" aria-live="polite">
          Carregando ranking...
        </p>
      </section>
    </div>

    <div class="store-dialog" id="store-dialog" hidden>
      <section class="store-card" role="dialog" aria-modal="true" aria-labelledby="store-title">
        <button
          class="ranking-close store-close"
          id="store-close"
          type="button"
          aria-label="Fechar loja"
        >×</button>
        <h1 class="store-title" id="store-title">Loja</h1>
        <div class="store-tabs" role="tablist" aria-label="Categorias da loja">
          <button
            class="store-tab"
            id="store-tab-skins"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="store-panel-skins"
            tabindex="0"
          >Skins</button>
          <button
            class="store-tab"
            id="store-tab-accessories"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="store-panel-accessories"
            tabindex="-1"
          >Acessórios</button>
          <button
            class="store-tab"
            id="store-tab-effects"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="store-panel-effects"
            tabindex="-1"
          >Efeitos</button>
        </div>
        <div class="store-panels">
          <section
            class="store-panel"
            id="store-panel-skins"
            role="tabpanel"
            aria-labelledby="store-tab-skins"
            tabindex="0"
          >
            <h2>Skins</h2>
            <p class="store-wallet" id="store-wallet"></p>
            <p class="store-message" id="store-message" role="status" aria-live="polite">
              Carregando skins...
            </p>
            <div class="store-skin-grid" id="store-skin-grid"></div>
          </section>
          <section
            class="store-panel"
            id="store-panel-accessories"
            role="tabpanel"
            aria-labelledby="store-tab-accessories"
            tabindex="0"
            hidden
          >
            <h2>Acessórios</h2>
            <p class="store-wallet" id="accessory-wallet"></p>
            <p class="store-message" id="accessory-message" role="status" aria-live="polite">
              Carregando acessórios...
            </p>
            <div class="store-skin-grid" id="store-accessory-grid"></div>
          </section>
          <section
            class="store-panel"
            id="store-panel-effects"
            role="tabpanel"
            aria-labelledby="store-tab-effects"
            tabindex="0"
            hidden
          >
            <h2>Efeitos</h2>
            <p class="store-wallet" id="effect-wallet"></p>
            <p class="store-message" id="effect-message" role="status" aria-live="polite">
              Carregando efeitos...
            </p>
            <div class="store-skin-grid" id="store-effect-grid"></div>
          </section>
        </div>
      </section>
    </div>

    <div class="account-dialog" id="account-dialog" hidden>
      <section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button
          class="dialog-close ranking-close store-close"
          id="account-close"
          type="button"
          aria-label="Fechar"
        >×</button>
        <h1 id="auth-title">Sua conta</h1>
        <div id="account-form-content">
          <div class="auth-switch">
            <button id="show-login" type="button" aria-pressed="true">Entrar</button>
            <button id="show-register" type="button" aria-pressed="false">Criar conta</button>
          </div>
          <form class="auth-form" id="auth-form">
            <label>
              Nome
              <input
                id="auth-name"
                name="name"
                autocomplete="username"
                maxlength="60"
                minlength="2"
                required
                placeholder="Seu nome"
              >
            </label>
            <label>
              Senha
              <input
                id="auth-password"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                required
                placeholder="Mínimo de 8 caracteres"
              >
            </label>
            <button id="auth-submit" type="submit">Entrar</button>
            <p class="auth-message" id="auth-message" role="status"></p>
          </form>
        </div>
        <div class="account-profile" id="account-profile" hidden>
          <div class="profile-identity">
            <p class="profile-name" id="profile-name"></p>
            <button
              class="store-skin-action profile-edit-toggle"
              id="profile-edit-toggle"
              type="button"
              aria-label="Editar nome"
              aria-expanded="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5zM20 7.5a1 1 0 0 0 0-1.4l-2.1-2.1a1 1 0 0 0-1.4 0L14.8 5.7l3.5 3.5L20 7.5z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <form class="profile-name-form" id="profile-name-form" hidden>
            <label for="profile-name-input">Nome do jogador</label>
            <input id="profile-name-input" name="nome" minlength="2" maxlength="15" required>
            <div class="profile-edit-actions">
              <button class="store-skin-action" id="profile-name-save" type="submit">Salvar</button>
              <button class="store-skin-action" id="profile-name-cancel" type="button">Cancelar</button>
            </div>
          </form>
          <p class="profile-message" id="profile-message" role="status" aria-live="polite"></p>
          <div class="profile-stat-grid" aria-label="Estatísticas da conta">
            <div class="profile-stat-card">
              <span>Pontos</span>
              <strong id="profile-score">0</strong>
            </div>
            <div class="profile-stat-card">
              <span>Moedas</span>
              <strong id="profile-coins">0</strong>
            </div>
          </div>
          <button class="store-skin-action profile-logout" id="account-logout" type="button">Sair da conta</button>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      
      <button class="bottom-nav-item" id="home-open" type="button" aria-label="Início">
        <svg class="bottom-nav-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 15L16 4l13 11h-4v13h-8v-8h-4v8H7V15z" fill="#edb34e" stroke="#32170f" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 28v-8h6v8M6 13l10-8 10 8" fill="none" stroke="#fff0b0" stroke-width="2"/>
        </svg>
        <span>Início</span>
      </button>

      <span class="bottom-nav-divider" aria-hidden="true"></span>
      
      <button
        class="bottom-nav-item"
        id="map-toggle"
        type="button"
        aria-label="Trocar mapa. Mapa atual: Clássico"
        title="Trocar mapa"
        disabled
      >
        <svg class="bottom-nav-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 7l8-4 10 4 8-4v22l-8 4-10-4-8 4z" fill="#edb34e" stroke="#32170f" stroke-width="2"/>
          <path d="M11 3v22M21 7v22" fill="none" stroke="#623019" stroke-width="2"/>
          <path d="M5 10h4v5H5zM14 12h4v5h-4zM23 10h4v5h-4z" fill="#6cae73" stroke="#623019" stroke-width="1"/>
        </svg>
        <span id="map-name">Mapa 1</span>
      </button>
      <span class="bottom-nav-divider" aria-hidden="true"></span>
      <button class="bottom-nav-item" id="store-open" type="button">
        <svg class="bottom-nav-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 12h22l-2-8H7z" fill="#edb34e" stroke="#32170f" stroke-width="2" stroke-linejoin="round"/>
          <path d="M7 12v16h18V12M13 28v-9h6v9" fill="#ae5927" stroke="#32170f" stroke-width="2" stroke-linejoin="round"/>
          <path d="M5 12a4 4 0 0 0 8 0 4 4 0 0 0 8 0 4 4 0 0 0 8 0" fill="#f2c56f" stroke="#32170f" stroke-width="2"/>
        </svg>
        <span>Loja</span>
      </button>
      <span class="bottom-nav-divider" aria-hidden="true"></span>
      <button class="bottom-nav-item" id="ranking-open" type="button">
        <svg class="bottom-nav-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M7 3h16l4 4v22H7z" fill="#edb34e" stroke="#32170f" stroke-width="2"/>
          <path d="M22 4v5h5M11 13h12M11 18h12M11 23h12" fill="none" stroke="#623019" stroke-width="2"/>
          <path d="M4 8h3v21H4z" fill="#ae5927" stroke="#32170f" stroke-width="2"/>
        </svg>
        <span>Ranking</span>
      </button>
    </nav>

    <script type="module" src="./script.js"></script>
  </body>
</html>
